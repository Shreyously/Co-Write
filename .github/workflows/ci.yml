name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- FRONTEND ----------

      - name: Install frontend dependencies
        run: |
          cd cowrite-frontend
          npm install

      - name: Lint frontend
        run: |
          cd cowrite-frontend
          npm run lint

      - name: Build frontend
        run: |
          cd cowrite-frontend
          npm run build

      # ---------- BACKEND ----------

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Backend syntax check
        run: |
          cd backend
          node --check src/server.js

      - name: Build backend Docker image
        run: docker build -t cowrite-backend:ci ./backend
